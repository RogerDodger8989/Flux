version: '3.8'

services:
  flux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flux
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret-in-production}
      - DATABASE_URL=file:/app/data/flux.db
    volumes:
      # Persistent database
      - flux-data:/app/data
      # Mount your photo library (adjust path as needed)
      - ${PHOTO_LIBRARY_PATH:-./photos}:/app/photos:ro
      # Thumbnails and cache
      - flux-thumbnails:/app/thumbnails
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  flux-data:
    driver: local
  flux-thumbnails:
    driver: local
